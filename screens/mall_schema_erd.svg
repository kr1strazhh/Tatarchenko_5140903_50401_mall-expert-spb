<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f7f5ef"/>
  <text x="800" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#14213d">MallExpert SPb: логическая схема БД</text>
  <text x="800" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#4b5563">User, Theme, MallItem, Evaluation + внешние ключи и уникальный индекс оценки</text>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111827" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0,0 L12,7 L0,14 z" fill="#0f766e"/>
    </marker>
  </defs>

  <g filter="url(#shadow)">
    <rect x="95" y="190" width="330" height="360" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="4"/>
    <rect x="95" y="190" width="330" height="78" rx="18" fill="#0f766e"/>
    <text x="260" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">users</text>
    <text x="125" y="315" font-family="Menlo, monospace" font-size="22" fill="#111827">id: bigint PK</text>
    <text x="125" y="358" font-family="Menlo, monospace" font-size="22" fill="#111827">email: string</text>
    <text x="125" y="401" font-family="Menlo, monospace" font-size="22" fill="#111827">password_digest</text>
    <text x="125" y="444" font-family="Menlo, monospace" font-size="22" fill="#111827">created_at</text>
    <text x="125" y="487" font-family="Menlo, monospace" font-size="22" fill="#111827">updated_at</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1175" y="190" width="330" height="300" rx="18" fill="#ffffff" stroke="#b45309" stroke-width="4"/>
    <rect x="1175" y="190" width="330" height="78" rx="18" fill="#b45309"/>
    <text x="1340" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">themes</text>
    <text x="1205" y="315" font-family="Menlo, monospace" font-size="22" fill="#111827">id: bigint PK</text>
    <text x="1205" y="358" font-family="Menlo, monospace" font-size="22" fill="#111827">name_ru: string</text>
    <text x="1205" y="401" font-family="Menlo, monospace" font-size="22" fill="#111827">name_en: string</text>
    <text x="1205" y="444" font-family="Menlo, monospace" font-size="22" fill="#111827">timestamps</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="635" y="170" width="360" height="430" rx="18" fill="#ffffff" stroke="#14213d" stroke-width="4"/>
    <rect x="635" y="170" width="360" height="78" rx="18" fill="#14213d"/>
    <text x="815" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">mall_items</text>
    <text x="665" y="295" font-family="Menlo, monospace" font-size="22" fill="#111827">id: bigint PK</text>
    <text x="665" y="338" font-family="Menlo, monospace" font-size="22" fill="#111827">theme_id: FK</text>
    <text x="665" y="381" font-family="Menlo, monospace" font-size="22" fill="#111827">name_ru/name_en</text>
    <text x="665" y="424" font-family="Menlo, monospace" font-size="22" fill="#111827">description_ru/en</text>
    <text x="665" y="467" font-family="Menlo, monospace" font-size="22" fill="#111827">address_ru/en</text>
    <text x="665" y="510" font-family="Menlo, monospace" font-size="22" fill="#111827">image_url: string</text>
    <text x="665" y="553" font-family="Menlo, monospace" font-size="22" fill="#111827">timestamps</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="450" y="635" width="720" height="220" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/>
    <rect x="450" y="635" width="720" height="64" rx="18" fill="#7c3aed"/>
    <text x="800" y="677" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">evaluations</text>
    <text x="485" y="735" font-family="Menlo, monospace" font-size="18" fill="#111827">id: bigint PK</text>
    <text x="485" y="772" font-family="Menlo, monospace" font-size="18" fill="#111827">user_id: FK | mall_item_id: FK</text>
    <text x="485" y="809" font-family="Menlo, monospace" font-size="18" fill="#111827">rating: integer 1..100 | comment: text</text>
    <text x="485" y="846" font-family="Menlo, monospace" font-size="18" fill="#111827">unique: [user_id, mall_item_id] | CHECK rating BETWEEN 1 AND 100</text>
  </g>

  <path d="M425 380 C510 410, 520 660, 450 725" fill="none" stroke="#0f766e" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="395" y="635" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f766e">1:N</text>

  <path d="M815 600 C815 620, 815 625, 815 635" fill="none" stroke="#7c3aed" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="835" y="635" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#7c3aed">1:N</text>

  <path d="M1175 350 C1085 350, 1040 350, 995 350" fill="none" stroke="#b45309" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="1065" y="330" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#b45309">1:N</text>

  <rect x="75" y="625" width="330" height="112" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="240" y="663" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#075985">Сессионная авторизация</text>
  <text x="240" y="699" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#075985">has_secure_password +</text>
  <text x="240" y="727" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#075985">session[:user_id]</text>

  <rect x="1220" y="625" width="290" height="112" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="1365" y="663" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#92400e">Локализация</text>
  <text x="1365" y="699" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#92400e">name_ru/name_en</text>
  <text x="1365" y="727" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#92400e">description_ru/en</text>
</svg>
