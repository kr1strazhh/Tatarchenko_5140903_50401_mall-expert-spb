<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="800" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#14213d">MallExpert SPb: пользовательский сценарий</text>
  <text x="800" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#475569">Асинхронная оценка ТЦ через Fetch API и личный кабинет с CSV</text>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111827" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="15" markerHeight="15" refX="11" refY="7.5" orient="auto">
      <path d="M0,0 L13,7.5 L0,15 z" fill="#0f766e"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="90" y="250" width="260" height="145" rx="24" fill="#ffffff" stroke="#0f766e" stroke-width="4"/>
    <text x="220" y="302" text-anchor="middle" font-size="25" font-weight="700" fill="#0f766e">1. Вход</text>
    <text x="220" y="340" text-anchor="middle" font-size="20" fill="#334155">Пользователь вводит</text>
    <text x="220" y="369" text-anchor="middle" font-size="20" fill="#334155">email и пароль</text>

    <rect x="410" y="250" width="260" height="145" rx="24" fill="#ffffff" stroke="#14213d" stroke-width="4"/>
    <text x="540" y="302" text-anchor="middle" font-size="25" font-weight="700" fill="#14213d">2. Категория</text>
    <text x="540" y="340" text-anchor="middle" font-size="20" fill="#334155">Выбор темы:</text>
    <text x="540" y="369" text-anchor="middle" font-size="20" fill="#334155">центр, семья, крупные</text>

    <rect x="730" y="250" width="260" height="145" rx="24" fill="#ffffff" stroke="#b45309" stroke-width="4"/>
    <text x="860" y="302" text-anchor="middle" font-size="25" font-weight="700" fill="#b45309">3. API GET</text>
    <text x="860" y="340" text-anchor="middle" font-size="20" fill="#334155">/api/v1/malls</text>
    <text x="860" y="369" text-anchor="middle" font-size="20" fill="#334155">первый неоцененный ТЦ</text>

    <rect x="1050" y="250" width="260" height="145" rx="24" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/>
    <text x="1180" y="302" text-anchor="middle" font-size="25" font-weight="700" fill="#7c3aed">4. Оценка</text>
    <text x="1180" y="340" text-anchor="middle" font-size="20" fill="#334155">Ползунок 1-100</text>
    <text x="1180" y="369" text-anchor="middle" font-size="20" fill="#334155">+ текстовый отзыв</text>

    <rect x="1250" y="530" width="260" height="145" rx="24" fill="#ffffff" stroke="#0f766e" stroke-width="4"/>
    <text x="1380" y="582" text-anchor="middle" font-size="25" font-weight="700" fill="#0f766e">5. API POST</text>
    <text x="1380" y="620" text-anchor="middle" font-size="20" fill="#334155">сохранение оценки</text>
    <text x="1380" y="649" text-anchor="middle" font-size="20" fill="#334155">и запрос следующего ТЦ</text>

    <rect x="790" y="530" width="310" height="145" rx="24" fill="#ffffff" stroke="#0284c7" stroke-width="4"/>
    <text x="945" y="582" text-anchor="middle" font-size="25" font-weight="700" fill="#0284c7">6. Личный кабинет</text>
    <text x="945" y="620" text-anchor="middle" font-size="20" fill="#334155">таблица оценок, средняя</text>
    <text x="945" y="649" text-anchor="middle" font-size="20" fill="#334155">оценка, группировка тем</text>

    <rect x="390" y="530" width="260" height="145" rx="24" fill="#ffffff" stroke="#dc2626" stroke-width="4"/>
    <text x="520" y="582" text-anchor="middle" font-size="25" font-weight="700" fill="#dc2626">7. CSV</text>
    <text x="520" y="620" text-anchor="middle" font-size="20" fill="#334155">export</text>
    <text x="520" y="649" text-anchor="middle" font-size="20" fill="#334155">my_evaluations.csv</text>
  </g>

  <path d="M350 322 L410 322" stroke="#0f766e" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
  <path d="M670 322 L730 322" stroke="#0f766e" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
  <path d="M990 322 L1050 322" stroke="#0f766e" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
  <path d="M1285 395 C1320 450, 1360 485, 1380 530" stroke="#0f766e" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
  <path d="M1250 602 L1100 602" stroke="#0f766e" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
  <path d="M790 602 L650 602" stroke="#0f766e" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
  <path d="M1380 530 C1425 425, 1330 385, 1270 385" stroke="#7c3aed" stroke-width="5" fill="none" stroke-dasharray="14 12" marker-end="url(#arrow)"/>

  <text x="1272" y="444" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#7c3aed">цикл до конца</text>
  <text x="1292" y="474" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#7c3aed">категории</text>
  <rect x="95" y="720" width="1410" height="76" rx="18" fill="#ecfeff" stroke="#06b6d4" stroke-width="3"/>
  <text x="800" y="752" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#155e75">Все действия после входа выполняются без полной перезагрузки страницы:</text>
  <text x="800" y="782" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#155e75">карточка ТЦ обновляется через Vanilla JS и JSON-ответы Rails API.</text>
</svg>
